# Performance gate for the SMOKE test (1 user, 1 iteration = 5 requests).
# A smoke test checks that the script and the target work. It is not a performance measurement,
# so it is strict on errors and lenient on response time.

# FAILURE if fewer samples than this were recorded (the journey did not run end-to-end).
min.samples=5

# Error rate in percent. Above "fail" => FAILURE, above "warn" => UNSTABLE.
error.pct.warn=0
error.pct.fail=0

# Overall 95th percentile in ms. Above "fail" => FAILURE, above "warn" => UNSTABLE.
p95.ms.warn=2000
p95.ms.fail=5000

# Critical transactions: more than critical.max.errors failures in any of them => FAILURE.
critical.labels=01_Login,04_Create_Order
critical.max.errors=0
