# Performance gate for the CI LOAD test. Agree these numbers with the product team and
# re-baseline them when the environment changes. Any key can be overridden from Jenkins
# with the GATE_OVERRIDES parameter, e.g.  p95.ms.warn=300 error.pct.fail=2

# FAILURE if fewer samples than this were recorded (test too short, agent problem, early abort).
min.samples=200

# Error rate in percent.
error.pct.warn=1.0
error.pct.fail=5.0

# Overall 95th percentile in ms.
p95.ms.warn=500
p95.ms.fail=1500

# Per-transaction 95th percentile limits (UNSTABLE when breached). Key = p95.ms.label.<label>
p95.ms.label.01_Login=400
p95.ms.label.04_Create_Order=600

# Critical transactions: more than critical.max.errors failures in any of them => FAILURE.
critical.labels=01_Login,04_Create_Order
critical.max.errors=0
